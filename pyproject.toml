[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subfork"
version = "2.0.0"
description = "Python API client for Subfork graph authoring and execution"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = ["httpx>=0.28,<1"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://python.subfork.com"

[project.scripts]
subfork = "subfork.cli:main"

[project.optional-dependencies]
docs = ["mkpages==0.4.1"]
dev = [
  "pytest>=8,<10",
  "build>=1,<2",
  "twine>=6,<7",
  "flake8==7.1.1",
  "flake8-docstrings==1.7.0",
  "mccabe==0.7.0",
  "isort==5.13.2",
  "black==24.8.0",
  "mypy==1.14.1",
]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
subfork = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.black]
line-length = 100
target-version = ["py38"]
extend-exclude = '/\.venv[^/]*/'

[tool.mypy]
python_version = "3.8"
files = ["src/subfork"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

# Newer environments install CLI/async dependency internals with newer syntax.
# Skip those internals while retaining HTTPX's client types and our 3.8 target.
[[tool.mypy.overrides]]
module = ["httpx._main", "anyio", "anyio.*"]
follow_imports = "skip"
